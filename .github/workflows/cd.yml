name: Trigger auto deployment for plant-disease-detector


on:
  workflow_run:
    workflows: ["CI - Run Tests"]
    branches: [ main ]
    types:
      - completed

 
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.PLANTDISEASEDETECTOR_AZURE_CREDENTIALS }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          dockerfilePath: Dockerfile
          registryUrl: plantdiseaseacr2026.azurecr.io
          registryUsername: ${{ secrets.PLANTDISEASEDETECTOR_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.PLANTDISEASEDETECTOR_REGISTRY_PASSWORD }}
          containerAppName: plant-disease-detector
          resourceGroup: plant-disease-rg
          imageToBuild: plantdiseaseacr2026.azurecr.io/plant-disease-detector:${{ github.event.workflow_run.head_sha }}