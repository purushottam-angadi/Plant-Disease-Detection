name: Trigger auto deployment for plant-disease-detector

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ main ]
    paths:
    - '**'
    - '.github/workflows/plant-disease-detector-AutoDeployTrigger-b1e29e8c-1797-4b15-9c85-b876b795cc26.yml'

  # Allow manual trigger 
  workflow_dispatch:
      
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.PLANTDISEASEDETECTOR_AZURE_CREDENTIALS }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}"./Dockerfile"
          _dockerfilePathKey_: _dockerfilePath_
          _targetLabelKey_: _targetLabel_
          registryUrl: plantdiseaseacr2026.azurecr.io
          registryUsername: ${{ secrets.PLANTDISEASEDETECTOR_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.PLANTDISEASEDETECTOR_REGISTRY_PASSWORD }}
          containerAppName: plant-disease-detector
          resourceGroup: plant-disease-rg
          imageToBuild: plantdiseaseacr2026.azurecr.io/plant-disease-detector:${{ github.sha }}
          
            

     

